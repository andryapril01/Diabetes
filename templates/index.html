<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prediksi Risiko Diabetes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="container">
    <section class="hero">
      <div>
        <span class="badge">Machine Learning App</span>
        <h1>Prediksi Risiko Diabetes</h1>
        <p>
          Sistem ini menggunakan model Random Forest untuk membantu memprediksi
          risiko diabetes berdasarkan data kesehatan dasar.
        </p>
      </div>
    </section>

    <section class="card">
      <form action="/predict" method="POST" id="predictForm">
        <div class="grid">
          <div class="input-group">
            <label>Pregnancies</label>
            <input type="number" step="any" name="Pregnancies" placeholder="Contoh: 2" required>
          </div>

          <div class="input-group">
            <label>Glucose</label>
            <input type="number" step="any" name="Glucose" placeholder="Contoh: 120" required>
          </div>

          <div class="input-group">
            <label>Blood Pressure</label>
            <input type="number" step="any" name="BloodPressure" placeholder="Contoh: 70" required>
          </div>

          <div class="input-group">
            <label>Skin Thickness</label>
            <input type="number" step="any" name="SkinThickness" placeholder="Contoh: 25" required>
          </div>

          <div class="input-group">
            <label>Insulin</label>
            <input type="number" step="any" name="Insulin" placeholder="Contoh: 80" required>
          </div>

          <div class="input-group">
            <label>BMI</label>
            <input type="number" step="any" name="BMI" placeholder="Contoh: 32.5" required>
          </div>

          <div class="input-group">
            <label>Diabetes Pedigree Function</label>
            <input type="number" step="any" name="DiabetesPedigreeFunction" placeholder="Contoh: 0.45" required>
          </div>

          <div class="input-group">
            <label>Age</label>
            <input type="number" step="any" name="Age" placeholder="Contoh: 35" required>
          </div>
        </div>

        <button type="submit" id="submitBtn">Prediksi Sekarang</button>
      </form>

      {% if hasil %}
      <div class="result">
        <p>Hasil Prediksi</p>
        <h2>{{ hasil }}</h2>
        <small>Hasil ini bersifat prediktif dan bukan diagnosis medis.</small>
      </div>
      {% endif %}
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
